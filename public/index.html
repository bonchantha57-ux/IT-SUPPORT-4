<!doctype html>
<html lang="km">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>បំពេញ ទិន្នន័យ - IT Support</title>
    
    <!-- Google Fonts for Khmer: Kantumruy Pro & Battambang -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:ital,wght@0,300..700;1,300..700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style id="expo-reset">
      /* Font-face for Ionicons on Web */
      @font-face {
        font-family: 'Ionicons';
        src: url('/fonts/Ionicons.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: block;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #F1F5F9;
        font-family: 'Kantumruy Pro', 'Battambang', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        overflow: hidden;
      }

      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      /* អនុវត្តពុម្ពអក្សរខ្មែរ Kantumruy Pro លើ Input និង Textarea */
      input, textarea, select, button {
        font-family: 'Kantumruy Pro', 'Battambang', system-ui, -apple-system, sans-serif !important;
      }

      /* Custom scrollbars */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #F1F5F9;
      }
      ::-webkit-scrollbar-thumb {
        background: #CBD5E1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94A3B8;
      }
    </style>
  </head>

  <body>
    <noscript>សូមបើក JavaScript ដើម្បីដំណើរការកម្មវិធីនេះ (Please enable JavaScript to run this application).</noscript>
    <div id="root"></div>
  </body>
</html>
